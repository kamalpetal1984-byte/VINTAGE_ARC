services:
  - type: web
    name: vintage-social
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MEMBER_CODE
        sync: false
      - key: ADMIN_CODE
        sync: false
