{% extends "base.html" %}{% block content %}<h1>Admin dashboard</h1><section class="panel"><h2>Members · {{ users|length }}</h2>{% for u in users %}<div class="adminrow"><span>{{ u.username }}</span><span class="muted">{{ u.role }}</span></div>{% endfor %}</section><section class="panel"><h2>Recent posts</h2>{% for p in posts %}<div class="adminrow"><span><b>{{ p.author.username }}</b> — {{ p.body[:100] }}</span><form method="post" action="{{ url_for('delete_post', post_id=p.id) }}" onsubmit="return confirm('Delete this post?')"><button class="danger">Delete</button></form></div>{% else %}<p class="muted">No posts.</p>{% endfor %}</section>{% endblock %}
