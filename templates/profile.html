{% extends "base.html" %}{% block content %}<section class="panel profile"><div class="avatar large">{{ user.username[0]|upper }}</div><h1>{{ user.username }}</h1><p class="muted">{{ user.role|upper }} · Joined {{ user.created_at.strftime('%d %b %Y') }}</p><form method="post"><label>About you</label><textarea name="bio" maxlength="180" placeholder="Write a short bio...">{{ user.bio }}</textarea><button class="primary">Save profile</button></form><p class="muted">Your posts: {{ user.posts|length }}</p></section>{% endblock %}
